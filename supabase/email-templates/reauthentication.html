<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f5f5f0">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f0;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px">
          <tr><td style="padding:0 4px 16px;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:#0d0d0c">
            Confu<span style="color:#eab308">.</span>
          </td></tr>
          <tr><td style="background:#ffffff;border:1px solid #0d0d0c;border-radius:14px;padding:28px 28px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0d0d0c">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr><td style="font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1.2;padding-bottom:12px">Your verification code</td></tr>
              <tr><td style="font-size:15px;line-height:1.6;color:#33332f;padding-bottom:16px">Enter this code in Confu to confirm it's you. It expires soon.</td></tr>
          <tr><td style="padding:4px 0 24px">
            <span style="display:inline-block;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:28px;letter-spacing:6px;background:#f5f5f0;border:1px dashed #0d0d0c;border-radius:8px;padding:10px 18px">{{ .Token }}</span>
          </td></tr>
            </table>
          </td></tr>
          <tr><td style="padding:16px 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b6b66">
            You're getting this because of an action on your Confu account ({{ .Email }}). If it wasn't you, you can ignore this email.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
