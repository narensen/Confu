version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to the version rehype-katex renders with, so the stylesheet
      # matches the markup (a newer one misplaces subscripts, e.g. H₂O).
      - dependency-name: katex
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
