name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a study session
        2. Highlight a line and ask the tutor
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - confu.lol
        - My own deployment
        - Running locally
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider and model (if it's about AI answers)
      placeholder: e.g. Groq, openai/gpt-oss-120b
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on Windows, Safari on iPhone
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
      description: Never paste an API key. Confu never asks you for one in an issue.
