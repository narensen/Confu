# Confu desktop builds. Unsigned (no paid certificates): Windows shows a
# SmartScreen notice and macOS asks to confirm the first open (right-click →
# Open). Updates come from GitHub Releases.
appId: lol.confu.desktop
productName: Confu
copyright: Copyright © 2026 Naren Sengodan and contributors (MIT)
artifactName: Confu-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
# Everything is bundled (Vite for the window, esbuild for the main process),
# so no node_modules ship: every dependency is a devDependency.
asar: true
publish:
  provider: github
  owner: narensen
  repo: Confu
  releaseType: release
mac:
  category: public.app-category.education
  target: [dmg, zip]
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Confu records lectures you choose to record, to transcribe them.
    NSAudioCaptureUsageDescription: Confu records your computer's sound when you record a lecture playing on it.
win:
  executableName: Confu
  target: [nsis]
nsis:
  oneClick: true
  perMachine: false
linux:
  executableName: confu
  syncDesktopName: true
  category: Education
  target: [AppImage, deb]
  maintainer: Confu <confuedu.ai@gmail.com>
  synopsis: Study your PDFs and lectures with a tutor that runs on your own AI.
  description: Confu is an open-source study app. Your library stays on your computer and, if you choose, syncs to your own Google Drive. The tutor uses the AI you bring (an API key or OpenRouter).
